<script>
(function () {
  var FAVS_KEY = '4g_favourites';

  function getFavs() {
    try { return JSON.parse(localStorage.getItem(FAVS_KEY)) || []; }
    catch(e) { return []; }
  }
  function saveFavs(arr) {
    localStorage.setItem(FAVS_KEY, JSON.stringify(arr));
  }
  function isFav(title) {
    return getFavs().includes(title);
  }
  function addFav(title) {
    var favs = getFavs();
    if (!favs.includes(title)) { favs.push(title); saveFavs(favs); }
  }
  function removeFav(title) {
    saveFavs(getFavs().filter(function(f){ return f !== title; }));
  }


  window.fgFavUtils = { isFav: isFav, getFavs: getFavs };

  var currentProxied = '';
  var currentDirect  = '';
  var currentTitle   = '';

  function updateFavBtn() {
    var btn = document.getElementById('fg-fav-btn');
    if (isFav(currentTitle)) {
      btn.textContent = 'Favorited';
      btn.classList.add('active');
    } else {
      btn.textContent = 'Favorite';
      btn.classList.remove('active');
    }
  }

  window.fgOpen = function(proxiedUrl, directUrl, title) {
    currentProxied = proxiedUrl;
    currentDirect  = directUrl;
    currentTitle   = title || 'game';
    document.getElementById('fg-title').textContent = currentTitle;
    document.getElementById('fg-iframe').src = proxiedUrl;
    document.getElementById('fg-loading').style.display = 'flex';
    document.getElementById('fg-viewer').classList.add('open');
    document.body.style.overflow = 'hidden';
    updateFavBtn();
  };

  window.fgClose = function() {
    document.getElementById('fg-viewer').classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function() {
      if (!document.getElementById('fg-viewer').classList.contains('open')) {
        document.getElementById('fg-iframe').removeAttribute('src');
      }
    }, 300);
  };

  window.fgToggleFav = function() {
    if (!currentTitle) return;
    if (isFav(currentTitle)) {
      removeFav(currentTitle);
    } else {
      addFav(currentTitle);
    }
    updateFavBtn();
    
    document.querySelectorAll('.card').forEach(function(card) {
      var gt = card.querySelector('.game-title');
      if (gt && gt.textContent.trim() === currentTitle) {
        card.classList.toggle('fav-card', isFav(currentTitle));
      }
    });
    
    if (window.fgResortGrid) window.fgResortGrid();
  };

  window.fgReload = function() {
    document.getElementById('fg-loading').style.display = 'flex';
    document.getElementById('fg-iframe').src = currentProxied;
  };

  window.fgOpenProxied = function() {
    if (currentProxied) window.open(currentProxied, '_blank');
  };

  window.fgOpenDirect = function() {
    if (currentDirect) window.open(currentDirect, '_blank');
  };

  window.fgDownload = function() {
    if (!currentProxied) return;
    fetch(currentProxied)
      .then(function(r) { return r.blob(); })
      .then(function(blob) {
        var url  = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        var safeName = currentTitle.replace(/[^a-z0-9_\-]/gi, '_').toLowerCase() || 'game';
        link.download = safeName + '.html';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
      })
      .catch(function() {
        window.open(currentProxied, '_blank');
      });
  };

  document.getElementById('fg-iframe').addEventListener('load', function() {
    document.getElementById('fg-loading').style.display = 'none';
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('fg-viewer').classList.contains('open')) fgClose();
  });

  document.addEventListener('click', function(e) {
    var link = e.target.closest('a[href]');
    if (!link) return;

    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('javascript:')) return;

    
    if (link.classList.contains('nav-icon-btn')) {
      e.preventDefault();
      var headerTitle = link.getAttribute('title') || 'Game Menu';
      fgOpen(href, href, headerTitle);
      return;
    }

    
    if (href.startsWith('http')) {
      e.preventDefault();
      var title = 'Game';
      var card = link.closest('.card');
      if (card) {
        var gt = card.querySelector('.game-title');
        if (gt) title = gt.textContent.trim();
      }
      fgOpen(href, href, title);
      return;
    }

    
    if (href.startsWith('/games/')) {
      e.preventDefault();
      var title = 'Game';
      var card = link.closest('.card');
      if (card) {
        var gt = card.querySelector('.game-title');
        if (gt) title = gt.textContent.trim();
      }
      fgOpen(href, href, title);
      return;
    }
  });
})();
</script>

<script>
(function() {
  var container = document.querySelector('.game-container');
  var shownEl   = document.getElementById('shownCount');
  var totalEl   = document.getElementById('totalCount');
  var input     = document.getElementById('searchInput');
  var allCards  = [];
  var currentShown = 0;

  function animate(el, from, to, duration) {
    duration = duration || 300;
    var start = performance.now();
    function update(now) {
      var progress = Math.min((now - start) / duration, 1);
      el.textContent = Math.floor(from + (to - from) * progress);
      if (progress < 1) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  }

  function sortCards() {
    var favs = window.fgFavUtils ? window.fgFavUtils.getFavs() : [];
    allCards.sort(function(a, b) {
      var aTitle = a.querySelector('.game-title').textContent.trim();
      var bTitle = b.querySelector('.game-title').textContent.trim();
      var aFav = favs.includes(aTitle) ? 0 : 1;
      var bFav = favs.includes(bTitle) ? 0 : 1;
      if (aFav !== bFav) return aFav - bFav;
      return aTitle.localeCompare(bTitle);
    });
    allCards.forEach(function(card) { container.appendChild(card); });
  }

  
  window.fgResortGrid = sortCards;

  // Game data is embedded in this HTML, so the grid does not need a cross-origin fetch.
  // Every game URL in the embedded list already points to the ngrok host.
  var games = JSON.parse(document.getElementById('embedded-game-list').textContent);

  var favs = window.fgFavUtils ? window.fgFavUtils.getFavs() : [];

  games.forEach(function(game) {
    var a = document.createElement('a');
    var gameUrl = new URL(game.url, 'https://overplay-washable-elk.ngrok-free.dev/').href;
    a.href = gameUrl;
    a.className = 'card';
    if (favs.includes(game.title)) a.classList.add('fav-card');
    var title = document.createElement('span');
    title.className = 'game-title';
    title.textContent = game.title;
    a.appendChild(title);
    container.appendChild(a);
    allCards.push(a);
  });

  sortCards();

  var total = allCards.length;
  totalEl.textContent = total;
  animate(shownEl, 0, total);
  currentShown = total;

  input.addEventListener('input', function() {
    var filter = input.value.toLowerCase();
    var visible = 0;
    allCards.forEach(function(card) {
      var name = card.querySelector('.game-title').textContent.toLowerCase();
      if (name.includes(filter)) { card.style.display = ''; visible++; }
      else { card.style.display = 'none'; }
    });
    animate(shownEl, currentShown, visible);
    currentShown = visible;
  });
})();
</script>

</body></html>
